<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List 任务管理工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 TODO List 任务管理</h1>
            <div class="overall-progress">
                <span>总进度:</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="overallProgressFill"></div>
                </div>
                <span id="overallProgressText">0%</span>
            </div>
        </header>

        <div class="toolbar">
            <button class="btn btn-primary" onclick="showAddTaskModal()">➕ 添加新任务</button>
            <button class="btn btn-secondary" onclick="saveToFile()">💾 保存到文件</button>
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📂 从文件加载</button>
            <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadFromFile(event)">
            <button class="btn btn-archive" onclick="showArchiveModal()">📁 归档管理</button>
            <button class="btn btn-info" onclick="showSummaryModal()">📊 工作总结</button>
            <button class="btn btn-danger" onclick="clearAllTasks()">🗑️ 清空所有</button>
        </div>

        <div id="taskList" class="task-list">
            <!-- 任务卡片将在这里动态生成 -->
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📝</div>
            <p>还没有任务，点击上方按钮添加第一个任务吧！</p>
        </div>
    </div>

    <!-- 添加任务模态框 -->
    <div id="addTaskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加新任务</h2>
                <button class="close-btn" onclick="closeAddTaskModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>任务名称:</label>
                    <input type="text" id="taskNameInput" placeholder="输入任务名称...">
                </div>
                <div class="form-group">
                    <label>子任务列表:</label>
                    <div id="subtaskInputs">
                        <div class="subtask-input-row">
                            <input type="text" class="subtask-input" placeholder="输入子任务...">
                            <button class="btn-icon" onclick="removeSubtaskInput(this)">❌</button>
                        </div>
                    </div>
                    <button class="btn btn-small" onclick="addSubtaskInput()">➕ 添加子任务</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddTaskModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmAddTask()">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 归档管理模态框 -->
    <div id="archiveModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>📁 归档管理</h2>
                <button class="close-btn" onclick="closeArchiveModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="archiveList">
                    <!-- 归档列表将在这里动态生成 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeArchiveModal()">关闭</button>
                <button class="btn btn-primary" onclick="exportArchiveToFile()">📥 导出归档</button>
            </div>
        </div>
    </div>

    <!-- 工作总结模态框 -->
    <div id="summaryModal" class="modal">
        <div class="modal-content modal-xlarge">
            <div class="modal-header">
                <h2>📊 工作总结报告</h2>
                <button class="close-btn" onclick="closeSummaryModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="summaryContent">
                    <!-- 总结内容将在这里动态生成 -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSummaryModal()">关闭</button>
                <button class="btn btn-primary" onclick="exportSummaryToPDF()">📄 导出 PDF</button>
                <button class="btn btn-primary" onclick="exportSummaryToFile()">📥 导出 JSON</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
